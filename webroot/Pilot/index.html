<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AutoPilot Manager</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);cursor:pointer;font-size:14px;font-weight:600;text-align:center}
.mode-btn.active{border-color:var(--accent);color:var(--accent)}
.mode-btn .small{font-weight:400;color:var(--muted)}
.item-subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.item-time{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

</style>
</head>
<body>

<div id="loader">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <div class="spinner-lg"></div>
    <div class="loader-text muted" style="font-weight:600">Processing...</div>
  </div>
</div>

<div class="wrap wrap-narrow">
  <h1>AutoPilot Manager</h1>

  <h2>System Status</h2>
  <div class="list-item">
    <div class="grow">
      <div style="font-weight:600">Automation Service</div>
      <div class="item-subtitle" id="statusSubtitle">Checking...</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="autopilotToggle" onchange="toggleAutopilot()">
      <span class="track"></span>
    </label>
  </div>

  <div class="list-item">
    <div class="grow">
      <div style="font-weight:600">Daemon Heartbeat</div>
      <div class="item-subtitle" id="heartbeatSubtitle">Checking...</div>
      <div class="item-time" id="heartbeatTime">--</div>
    </div>
    <span class="chip" id="heartbeatChip">--</span>
  </div>

  <div class="list-item">
    <div class="grow">
      <div style="font-weight:600">Last GitHub Check</div>
      <div class="item-subtitle" id="githubSubtitle">Checking...</div>
      <div class="item-time" id="githubTime">--</div>
    </div>
  </div>

  <div class="list-item">
    <div class="grow">
      <div style="font-weight:600">Emergency Level</div>
      <div class="item-subtitle">Master Control</div>
    </div>
    <span class="chip chip-muted" id="emergencyBadge"><span id="emergencyText">None</span></span>
  </div>

  <h2>Execution Mode</h2>
  <div class="mode-grid">
    <div class="mode-btn" id="fullMode" onclick="setMode('full')">
      <div>Xtreme Mode</div>
    </div>
    <div class="mode-btn" id="keyboxMode" onclick="setMode('keybox')">
      <div>Keybox Only Mode</div>
    </div>
  </div>

  <div class="card">
    <div class="help-title" style="font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px" id="modeDescTitle">Select Mode</div>
    <p class="small" id="modeDescText" style="line-height:1.5">Choose an execution mode to view details</p>
  </div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
