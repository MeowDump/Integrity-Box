<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verified Boot Hash</title>
<link rel="stylesheet" href="../common.css"/>
<style>
#new-hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#savedHash{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap wrap-narrow">
  <h1>Verified Boot Hash</h1>

  <div class="card">
    <p class="muted small" style="margin-bottom:12px">Only A–Z and 0–9, no labels, no spaces</p>
    <input id="new-hash" placeholder="E.g. F99B5EA989109F1E4702BD3"/>
    <div class="row" style="margin-top:14px">
      <button id="apply" class="btn btn-primary grow"><span class="spinner"></span>Apply</button>
      <button id="reset" class="btn grow">Reset</button>
      <button id="reboot" class="btn btn-danger grow">Reboot</button>
    </div>
    <div class="row small" style="margin-top:16px">
      <span class="muted">Saved:</span>
      <span id="savedHash" class="mono grow">Config is empty </span>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
