<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Help Menu</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.action-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:10px}
.action-card:active{background:var(--panel-2)}
.card-title{font-weight:600;font-size:15px}
.card-desc{font-size:13px;color:var(--muted)}
.arrow{margin-left:auto;color:var(--muted)}
.divider{height:1px;background:var(--border);margin:18px 0}
</style>
</head>
<body>
<div class="wrap wrap-narrow">
  <h1>Help Center</h1>
  <p class="muted small" style="margin-bottom:16px">Support &amp; Resources</p>

  <div class="card-list">
    <div class="action-card" data-action="link" data-url="https://t.me/TempMeow">
      <div>
        <div class="card-title">Report Bug</div>
        <div class="card-desc">Submit issues to Telegram</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="action-card" data-action="link" data-url="https://t.me/MeowDump">
      <div>
        <div class="card-title">Support Group</div>
        <div class="card-desc">Join Telegram community</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="action-card" data-action="link" data-url="https://t.me/MeowRedirect">
      <div>
        <div class="card-title">Updates Channel</div>
        <div class="card-desc">Latest news &amp; releases</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="action-card" data-action="link" data-url="https://github.com/MeowDump/Integrity-Box">
      <div>
        <div class="card-title">Source Code</div>
        <div class="card-desc">View on GitHub</div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="divider"></div>

    <div class="action-card" data-action="script">
      <div>
        <div class="card-title">Export Report</div>
        <div class="card-desc">Generate diagnostic logs</div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>

  <div class="small muted" style="text-align:center;margin-top:24px">IntegrityBox • 2026</div>
</div>

<script>
function showToast(msg, type = "info") {
  try {
    if (typeof window.toast === "function") { window.toast(String(msg)); return; }
    if (window.kernelsu && typeof window.kernelsu.toast === "function") { window.kernelsu.toast(String(msg)); return; }
    if (typeof ksu === "object" && typeof ksu.toast === "function") { ksu.toast(String(msg)); return; }
  } catch {}

  let t = document.querySelector(".toast");
  if (!t) {
    t = document.createElement("div");
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => t.classList.remove("show"), 2500);
}

function openLink(url) {
  try {
    ksu.exec("am start -a android.intent.action.VIEW -d " + url);
    showToast("Opening...");
  } catch {
    showToast("Failed to open link", "error");
  }
}

function runScript() {
  try {
    ksu.exec("sh /data/adb/modules/playintegrityfix/webroot/common_scripts/Report.sh");
    showToast("Exported to /sdcard/report.json", "success");
  } catch {
    showToast("Failed to export", "error");
  }
}

document.querySelectorAll(".action-card").forEach(card => {
  card.addEventListener("click", () => {
    if (card.dataset.action === "link") {
      openLink(card.dataset.url);
    } else {
      runScript();
    }
  });
});
</script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
