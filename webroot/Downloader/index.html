<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meow Downloader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(circle at 50% 0%, #1c2045 0%, #0e1020 60%);
  color: #e9ecff;
  min-height: 100vh;
  padding: 0 16px 180px;
}
.header {
  padding: 52px 4px 8px;
  text-align: center;
}
.header h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.8px;
  background: linear-gradient(135deg, #e9ecff 0%, #9aa3ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header p {
  font-size: 13px;
  color: #9aa3ff;
  margin-top: 6px;
}
.toolbar {
  display: flex;
  gap: 10px;
  margin: 20px 4px;
}
.toolbar button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #ffffff14;
  background: #1b1e33cc;
  backdrop-filter: blur(14px);
  color: #9aa3ff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.toolbar button.primary {
  background: #4da3ff;
  color: #0e1020;
  border-color: transparent;
}
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  margin: 0 4px 10px;
  border-radius: 16px;
  background: #1b1e33cc;
  backdrop-filter: blur(14px);
  border: 1px solid #ffffff08;
}
.item-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.item-icon.zip { background: #4da3ff22; }
.item-icon.apk { background: #4dff8822; }
.item-icon.json { background: #ffaa4d22; }
.item-icon.kpm { background: #c77dff22; }
.item-icon svg { width: 22px; height: 22px; }
.item-icon.zip svg { fill: #4da3ff; }
.item-icon.apk svg { fill: #4dff88; }
.item-icon.json svg { fill: #ffaa4d; }
.item-icon.kpm svg { fill: #c77dff; }
.item-info { flex: 1; min-width: 0; }
.item-name {
  font-size: 15px;
  font-weight: 600;
  color: #e9ecff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-desc {
  font-size: 11px;
  color: #9aa3ff;
  margin-top: 2px;
}
.item-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  text-transform: uppercase;
}
.item-badge.zip { background: #4da3ff22; color: #4da3ff; }
.item-badge.apk { background: #4dff8822; color: #4dff88; }
.item-badge.json { background: #ffaa4d22; color: #ffaa4d; }
.item-badge.kpm { background: #c77dff22; color: #c77dff; }
.ios-toggle {
  position: relative;
  width: 50px;
  height: 30px;
  flex-shrink: 0;
  cursor: pointer;
}
.ios-toggle .track {
  position: absolute;
  inset: 0;
  background: #ffffff14;
  border-radius: 30px;
  transition: 0.25s;
}
.ios-toggle .thumb {
  position: absolute;
  height: 26px;
  width: 26px;
  left: 2px;
  bottom: 2px;
  background: #e9ecff;
  border-radius: 50%;
  transition: 0.25s;
  box-shadow: 0 2px 6px #00000044;
}
.ios-toggle.on .track { background: #4da3ff; }
.ios-toggle.on .thumb { transform: translateX(20px); }
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
  background: #0e1020ee;
  backdrop-filter: blur(20px);
  border-top: 1px solid #ffffff10;
  display: flex;
  gap: 12px;
  z-index: 100;
}
.bottom-bar button {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.btn-dl { background: #4da3ff; color: #0e1020; }
.btn-dl:disabled { background: #4da3ff44; color: #4da3ff88; cursor: not-allowed; }
.btn-clear { background: #1b1e33; color: #ff4d4d; border: 1px solid #ffffff14; }
.status-area {
  margin: 0 4px 16px;
  padding: 16px;
  border-radius: 16px;
  background: #1b1e33cc;
  border: 1px solid #ffffff08;
  display: none;
}
.status-area.active { display: block; }
.status-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.status-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #ffffff08;
  font-size: 12px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.pending { background: #ffffff30; }
.status-dot.running { background: #4da3ff; animation: pulse 1s infinite; }
.status-dot.done { background: #4dff88; }
.status-dot.fail { background: #ff4d4d; }
.status-name { flex: 1; }
.status-text { color: #9aa3ff; font-size: 11px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.debug-log {
  margin: 0 4px 16px;
  padding: 12px;
  border-radius: 12px;
  background: #00000066;
  border: 1px solid #ffffff10;
  font-family: monospace;
  font-size: 10px;
  color: #9aa3ff;
  min-height: 120px;
  max-height: 40vh;
  overflow-y: auto;
}
.debug-log div { padding: 2px 0; border-bottom: 1px solid #ffffff08; }
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #1b1e33ee;
  backdrop-filter: blur(20px);
  color: #e9ecff;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid #ffffff14;
  box-shadow: 0 20px 60px #00000088;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 1000;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <h1>Meow Downloader</h1>
  <p>Output: /sdcard/Download/IntegrityModules</p>
</div>

<div class="toolbar">
  <button onclick="selectAll()">Select All</button>
  <button onclick="deselectAll()">Deselect All</button>
</div>

<div id="list"></div>

<div class="status-area" id="statusArea">
  <div class="status-title">Download Progress</div>
  <div id="statusList"></div>
</div>

<div class="debug-log" id="debugLog"></div>

<div class="bottom-bar">
  <button class="btn-clear" onclick="deselectAll()">Clear</button>
  <button class="btn-dl" id="dlBtn" onclick="startDownload()">Download Selected</button>
</div>

<div class="toast" id="toast"></div>

<script>
var ICONS = {
  zip: '<svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>',
  apk: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
  json: '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
  kpm: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>'
};

var DOWNLOADS = [
  { id: "zn", name: "Zygisk Next", desc: "Dr-TSNG / v1.4.4", type: "zip", url: "https://github.com/Dr-TSNG/ZygiskNext/releases/download/v1.4.4/Zygisk-Next-1.4.4-831-98fd9c6-release.zip", filename: "ZygiskNext.zip" },
  { id: "ts", name: "TrickyStore", desc: "5ec1cff / v1.4.1", type: "zip", url: "https://github.com/5ec1cff/TrickyStore/releases/download/1.4.1/Tricky-Store-v1.4.1-245-72b2e84-release.zip", filename: "TrickyStore.zip" },
  { id: "hma2", name: "HMA-OSS", desc: "frknkrc44 / oss-164", type: "zip", url: "https://github.com/frknkrc44/HMA-OSS/releases/download/oss-164/HMA-OSS-ZYGISK-oss-164-release.zip", filename: "HMA_OOS.zip" },
  { id: "nhl", name: "NoHello", desc: "MhmRdd / v1.8.3", type: "kpm", url: "https://github.com/MeowDump/TG2Git/releases/download/TG2Git/Nohello-v1.8.3.7-102-ab38e9c-release.kpm", filename: "NoHello.kpm" },
  { id: "nh", name: "NoHello", desc: "MhmRdd / v1.8.2", type: "kpm", url: "https://github.com/MeowDump/TG2Git/releases/download/TG2Git/Nohello-v1.8.2-48-f824968-release.kpm", filename: "NoHello-old.kpm" },
  { id: "sh", name: "SeLinuxHook", desc: "Admirepowered / 1.1.6.1", type: "kpm", url: "https://github.com/MeowDump/TG2Git/releases/download/TG2Git/selinux_hook_1.1.6.1.kpm", filename: "SeLinuxHook.kpm" },
  { id: "hma", name: "HMA Config", desc: "MeowDump / config.json", type: "json", url: "https://github.com/MeowDump/Integrity-Box/releases/download/v39/v8-HMA-OOS-config.json", filename: "HMA_Config.json" },
  { id: "ka", name: "KeyAttestation", desc: "qwq233 / v1.8.4", type: "apk", url: "https://github.com/qwq233/KeyAttestation/releases/download/1.8.4/key-attestation-v1.8.4-release.apk", filename: "KeyAttestation.apk" },
  { id: "ul", name: "UpdateLocker", desc: "ru.mike / v1.4.3", type: "apk", url: "https://github.com/Xposed-Modules-Repo/ru.mike.updatelocker/releases/download/20-1.4.3/updatelocker_v1.4.3_icon.apk", filename: "UpdateLocker.apk" },
  { id: "rp", name: "Reverse Pixelify", desc: "uragiristereo / v1.0", type: "apk", url: "https://github.com/uragiristereo/Reverse_Pixelify/releases/download/v1.0/Reverse_Pixelify_v1.0.apk", filename: "Disable_ROM_spoofing_lsposed.apk" },
  { id: "kw", name: "KSU WebUI", desc: "MeowDump / v2", type: "apk", url: "https://github.com/MeowDump/KsuWebUIStandalone/releases/download/v2/v2-Meow-KsuWebUI.apk", filename: "WebUI.apk" },
  { id: "cp", name: "CorePatch", desc: "LSPosed / N-1.0", type: "apk", url: "https://github.com/LSPosed/CorePatch/releases/download/N-1.0/app-release.apk", filename: "Downgrade_Playstore.apk" },
  { id: "th", name: "Thor", desc: "trinadhthatakula / v1.93.2", type: "apk", url: "https://github.com/trinadhthatakula/Thor/releases/download/v1.93.2-dev-106/foss-release.apk", filename: "Installation_Spoofer.apk" },
  { id: "ma", name: "MeowAssistant", desc: "MeowDump / v1", type: "apk", url: "https://github.com/MeowDump/MeowAssistant/releases/download/v1/v1-MeowTile.apk", filename: "Meow_QS_Tile.apk" },
  { id: "af", name: "AndroidFaker", desc: "Android1500 / v2.0.0-beta", type: "apk", url: "https://github.com/Android1500/AndroidFaker/releases/download/v2.0.0-beta-9-6/AF-v2.0.0-beta-9-6.apk", filename: "Android_Faker.apk" }
];

var FLAG_DIR = "/data/adb/Box-Brain/MeowDownloader";
var LOG_FILE = "/data/adb/Box-Brain/Integrity-Box-Logs/IntegrityDownloader.log";
var OUT_DIR = "/sdcard/Download/IntegrityModules";

var listEl = document.getElementById("list");
var statusArea = document.getElementById("statusArea");
var statusList = document.getElementById("statusList");
var dlBtn = document.getElementById("dlBtn");

function log(msg) {
  var el = document.getElementById("debugLog");
  var line = document.createElement("div");
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function sh(cmd) {
  try { return ksu.exec(cmd); } catch (e) { log("SH_ERR: " + (e.message || e)); return ""; }
}

function showToast(msg) {
  log("TOAST: " + msg);
  var t = document.getElementById("toast");
  if (typeof window.toast === "function") { window.toast(msg); return; }
  if (window.kernelsu && typeof window.kernelsu.toast === "function") { window.kernelsu.toast(msg); return; }
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 3000);
}

function renderList() {
  var html = "";
  for (var i = 0; i < DOWNLOADS.length; i++) {
    var item = DOWNLOADS[i];
    html += '<div class="item" id="item-' + item.id + '">' +
      '<div class="item-icon ' + item.type + '">' + ICONS[item.type] + '</div>' +
      '<div class="item-info">' +
        '<div class="item-name">' + item.name + '</div>' +
        '<div class="item-desc">' + item.desc + '</div>' +
      '</div>' +
      '<div class="item-badge ' + item.type + '">' + item.type + '</div>' +
      '<div class="ios-toggle" id="toggle-' + item.id + '" onclick="manualToggle(\'' + item.id + '\')">' +
        '<div class="track"></div>' +
        '<div class="thumb"></div>' +
      '</div>' +
    '</div>';
  }
  listEl.innerHTML = html;
}

function manualToggle(id) {
  var toggle = document.getElementById("toggle-" + id);
  var isOn = toggle.classList.contains("on");
  if (isOn) {
    toggle.classList.remove("on");
    sh('rm -f "' + FLAG_DIR + '/' + id + '"');
    log("Toggle OFF: " + id);
  } else {
    toggle.classList.add("on");
    sh('mkdir -p "' + FLAG_DIR + '"');
    sh('touch "' + FLAG_DIR + '/' + id + '"');
    log("Selected: " + id);
  }
}

function selectAll() {
  sh('mkdir -p "' + FLAG_DIR + '"');
  for (var i = 0; i < DOWNLOADS.length; i++) {
    var id = DOWNLOADS[i].id;
    var toggle = document.getElementById("toggle-" + id);
    if (toggle && !toggle.classList.contains("on")) {
      toggle.classList.add("on");
      sh('touch "' + FLAG_DIR + '/' + id + '"');
    }
  }
  log("Select All");
}

function deselectAll() {
  sh('rm -rf "' + FLAG_DIR + '"');
  for (var i = 0; i < DOWNLOADS.length; i++) {
    var toggle = document.getElementById("toggle-" + DOWNLOADS[i].id);
    if (toggle) toggle.classList.remove("on");
  }
  statusArea.classList.remove("active");
  statusList.innerHTML = "";
  log("Deselect All");
}

function updateStatus(id, state, text) {
  var el = document.getElementById("st-" + id);
  if (!el) {
    var item = null;
    for (var i = 0; i < DOWNLOADS.length; i++) {
      if (DOWNLOADS[i].id === id) { item = DOWNLOADS[i]; break; }
    }
    el = document.createElement("div");
    el.id = "st-" + id;
    el.className = "status-item";
    el.innerHTML = '<div class="status-dot pending" id="dot-' + id + '"></div><div class="status-name">' + (item ? item.name : id) + '</div><div class="status-text" id="txt-' + id + '">Pending</div>';
    statusList.appendChild(el);
  }
  document.getElementById("dot-" + id).className = "status-dot " + state;
  document.getElementById("txt-" + id).textContent = text;
}

function getSelectedIds() {
  var ids = [];
  for (var i = 0; i < DOWNLOADS.length; i++) {
    var toggle = document.getElementById("toggle-" + DOWNLOADS[i].id);
    if (toggle && toggle.classList.contains("on")) {
      ids.push(DOWNLOADS[i].id);
    }
  }
  return ids;
}

function findItem(id) {
  for (var i = 0; i < DOWNLOADS.length; i++) {
    if (DOWNLOADS[i].id === id) return DOWNLOADS[i];
  }
  return null;
}

function buildDownloadCmd(item) {
  return 'OUT="' + OUT_DIR + '"; mkdir -p "$OUT"; DL=""; ' +
    'command -v curl >/dev/null 2>&1 && DL="curl"; ' +
    '[ -z "$DL" ] && command -v wget >/dev/null 2>&1 && DL="wget"; ' +
    '[ -z "$DL" ] && [ -x /data/adb/magisk/busybox ] && DL="bb"; ' +
    '[ -z "$DL" ] && [ -x /data/adb/ksu/bin/busybox ] && DL="bb"; ' +
    '[ -z "$DL" ] && toybox wget --help >/dev/null 2>&1 && DL="toybox"; ' +
    'if [ -z "$DL" ]; then echo "NO_DL"; exit 1; fi; ' +
    'tmp="$OUT/' + item.filename + '.tmp"; rm -f "$tmp"; ok=0; ' +
    'for i in 1 2 3; do ' +
      'if [ "$DL" = "curl" ]; then curl -L --fail --connect-timeout 10 --max-time 120 -o "$tmp" "' + item.url + '" 2>/dev/null; ' +
      'elif [ "$DL" = "wget" ]; then wget --no-check-certificate -O "$tmp" "' + item.url + '" 2>/dev/null; ' +
      'elif [ "$DL" = "bb" ]; then /data/adb/magisk/busybox wget --no-check-certificate -O "$tmp" "' + item.url + '" 2>/dev/null || /data/adb/ksu/bin/busybox wget --no-check-certificate -O "$tmp" "' + item.url + '" 2>/dev/null; ' +
      'elif [ "$DL" = "toybox" ]; then toybox wget -O "$tmp" "' + item.url + '" 2>/dev/null; ' +
      'fi; ' +
      'if [ -s "$tmp" ]; then mv "$tmp" "$OUT/' + item.filename + '"; echo "OK"; ok=1; break; fi; ' +
      'rm -f "$tmp"; sleep 1; ' +
    'done; ' +
    'if [ "$ok" = "0" ]; then echo "FAIL"; fi';
}

function startDownload() {
  log("Preparing Download...");
  var selectedIds = getSelectedIds();
  log("Selected: " + selectedIds.join(", "));
  
  if (selectedIds.length === 0) {
    showToast("Nothing selected");
    return;
  }
  
  dlBtn.disabled = true;
  statusArea.classList.add("active");
  statusList.innerHTML = "";
  
  for (var i = 0; i < selectedIds.length; i++) {
    updateStatus(selectedIds[i], "pending", "Queued");
  }
  
  sh('mkdir -p "' + OUT_DIR + '"');
  sh('rm -f "' + LOG_FILE + '"');
  sh('echo "START" > "' + LOG_FILE + '"');
  
  downloadNext(selectedIds, 0);
}

function downloadNext(ids, index) {
  if (index >= ids.length) {
    var dots = statusList.querySelectorAll(".status-dot");
    var done = 0, fail = 0;
    for (var i = 0; i < dots.length; i++) {
      var cls = dots[i].className;
      if (cls.indexOf("done") !== -1) done++;
      else if (cls.indexOf("fail") !== -1) fail++;
    }
    showToast("Finished: " + done + " OK, " + fail + " failed");
    dlBtn.disabled = false;
    sh('rm -f "' + FLAG_DIR + '"/*');
    for (var i = 0; i < DOWNLOADS.length; i++) {
      var toggle = document.getElementById("toggle-" + DOWNLOADS[i].id);
      if (toggle) toggle.classList.remove("on");
    }
    return;
  }
  
  var item = findItem(ids[index]);
  if (!item) {
    downloadNext(ids, index + 1);
    return;
  }
  
  updateStatus(item.id, "running", "Downloading...");
  log("Starting: " + item.name);
  
  var cmd = buildDownloadCmd(item);
  
  requestAnimationFrame(function() {
    setTimeout(function() {
      log("Exec: " + item.name);
      var result = sh(cmd);
      var out = String(result || "").trim();
      log("Result [" + item.name + "]: " + out);
      
      sh('echo "' + item.name + ':' + out + '" >> "' + LOG_FILE + '"');
      
      if (out === "OK") {
        updateStatus(item.id, "done", "Complete");
        showToast(item.name + " done");
      } else if (out === "NO_DL") {
        updateStatus(item.id, "fail", "No downloader");
        showToast("No curl/wget found!");
      } else {
        updateStatus(item.id, "fail", "Failed");
      }
      
      downloadNext(ids, index + 1);
    }, 50);
  });
}

renderList();
</script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
