<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Meow Downloader</title>
<link rel="stylesheet" href="../common.css"/>
<style>
body{padding:0 16px 150px}
.toolbar{display:flex;gap:10px;margin:16px 0}
.toolbar button{flex:1}

.item-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-desc{font-size:11px;color:var(--muted);margin-top:2px}
.item-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;flex:none}
.type-zip{background:rgba(79,140,255,.12);color:var(--accent)}
.type-apk{background:rgba(63,185,111,.12);color:var(--ok)}
.type-json{background:rgba(217,165,20,.12);color:var(--warn)}
.type-kpm{background:rgba(139,147,167,.12);color:var(--muted)}
.status-area{margin-bottom:16px}
.status-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.pending{background:var(--muted)}
.status-dot.running{background:var(--accent)}
.status-dot.done{background:var(--ok)}
.status-dot.fail{background:var(--err)}
.status-name{flex:1}
.status-text{color:var(--muted);font-size:11px}
#debugLog div{padding:2px 0;border-bottom:1px solid var(--border)}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:12px;z-index:100}
.bottom-bar .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">

  <h1>Meow Downloader</h1>
  <p class="muted small">Output: /sdcard/Download/IntegrityModules</p>

  <div class="toolbar">
    <button class="btn" onclick="selectAll()">Select All</button>
    <button class="btn" onclick="deselectAll()">Deselect All</button>
  </div>

  <div id="list"></div>

  <div class="card status-area" id="statusArea" style="display:none">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Download Progress</div>
    <div id="statusList"></div>
  </div>

  <div class="log" id="debugLog"></div>
</div>

<div class="bottom-bar">
  <button class="btn btn-danger" onclick="deselectAll()">Clear</button>
  <button class="btn btn-primary" id="dlBtn" onclick="startDownload()"><span class="spinner"></span>Download Selected</button>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
