<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PlayIntegrity PIF Selector</title>
<link rel="stylesheet" href="../common.css"/>
<style>

.item .line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.item .num{font-weight:700;color:var(--accent);flex:none}
.empty{text-align:center;color:var(--muted);padding:22px 0}
.refresh-btn{margin-top:10px;text-align:center;font-size:13px;cursor:pointer;color:var(--accent);opacity:.75;padding:8px 0}
.refresh-btn:hover{opacity:1}
</style>
</head>
<body>
<div class="wrap wrap-narrow">
  <h1>Play Integrity Prop Selector</h1>

  <div class="card">
    <div id="rows" aria-live="polite">
      <div class="empty">Scanning for <code>*pixel.txt</code> …</div>
    </div>
    <div class="refresh-btn" onclick="forceRefresh()">Refresh List</div>
    <div class="small muted" style="text-align:center;margin-top:8px">IntegrityBox • 2025</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
