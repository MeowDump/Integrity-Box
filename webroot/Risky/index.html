<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applist Detector</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.status-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--panel-2)}
.app-icon{width:40px;height:40px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--panel)}
.status-content{flex:1;min-width:0}
.status-name{font-size:14px;font-weight:600;word-break:break-word;line-height:1.3}
.status-pkg{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;line-height:1.3}
.chip.risky{background:rgba(224,82,82,.12);color:var(--err)}
.chip.spoofed{background:rgba(217,165,20,.12);color:var(--warn)}
.chip.safe{background:rgba(63,185,111,.12);color:var(--ok)}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;color:var(--muted);text-align:center;font-size:14px}
.stat-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stat-value{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Applist Detector</h1>
  <p class="muted small" style="margin-bottom:14px">Powered by Integrity Box</p>

  <div class="row" style="margin-bottom:14px">
    <button id="run-btn" class="btn btn-primary grow">
      <span class="spinner"></span>
      Run Scan
    </button>
    <button id="clear-log" class="btn">Clear</button>
  </div>

  <div class="row" id="progress" style="display:none;margin-bottom:14px;padding:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm)">
    <span class="small" style="font-weight:600">Scanning applications...</span>
    <span class="muted small grow" id="progress-detail">Initializing...</span>
  </div>

  <div class="row" id="stats" style="display:none;gap:16px;margin-bottom:14px;padding:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm)">
    <div class="stat-item"><span class="stat-value" id="total-count">0</span><span>scanned</span></div>
    <div class="stat-item"><span class="stat-value" id="risky-count" style="color:var(--err)">0</span><span>risks</span></div>
    <div class="stat-item"><span class="stat-value" id="spoofed-count" style="color:var(--warn)">0</span><span>spoofed</span></div>
  </div>

  <div class="log" id="output-log" style="min-height:200px;max-height:600px;white-space:normal">
    <div class="log-empty">
      <div>Ready to scan<br>Tap "Run Scan" to begin</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
