<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Target Box</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.list{display:flex;flex-direction:column;max-height:55vh;overflow-y:auto;padding-right:4px}

.item.blacklisted{border-color:rgba(224,82,82,.4)}
.item.blacklisted .name{color:var(--err)}
.app-icon{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--panel);object-fit:contain;flex-shrink:0}
.info{display:flex;flex-direction:column;min-width:0;flex:1}
.name{font-weight:600;font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.icon-btn{height:36px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0}
.icon-btn.blacklisted{border-color:rgba(224,82,82,.4);color:var(--err)}
.select-all-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px}
.select-all-bar span{font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Target Box</h1>

  <div class="card">
    <input id="search" type="search" placeholder="Filter packages or labels..." style="margin-bottom:10px"/>

    <div class="select-all-bar">
      <span>Blacklist</span>
      <button class="btn" onclick="selectAllBlacklist()" style="min-height:32px;padding:0 12px;font-size:13px">Select All</button>
    </div>

    <div class="list" id="list"></div>
    <button class="btn btn-block" onclick="backupTargets()" style="margin-top:8px">
      <span class="spinner"></span>
      Backup Targets
    </button>
    <button class="btn btn-block" onclick="restoreTargets()" style="margin-top:8px">Restore Targets</button>
  </div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
