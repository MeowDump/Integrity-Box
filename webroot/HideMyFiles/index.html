<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hide My Files</title>
<link rel="stylesheet" href="../common.css"/>
<style>

.path{font-size:14px;word-break:break-all}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mode{display:flex;gap:10px;margin-top:6px}
.mode button{flex:1}
.mode button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mode button[disabled]{opacity:.4;pointer-events:none}
.progress{height:6px;background:var(--panel-2);border-radius:6px;overflow:hidden;margin:14px 0}
.progress .bar{height:100%;width:0%;background:var(--accent);transition:width .3s}
.add-row{display:flex;gap:8px;margin-bottom:14px}
.add-row input{flex:1}
.add-row button{flex:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hide Suspicious Files</h1>
  <p class="muted small" style="margin-bottom:14px">Powered by IntegrityBox</p>

  <div class="add-row">
    <input id="customPath" placeholder="Enter custom path to hide"/>
    <button class="btn btn-primary" onclick="addCustomPath()" title="Add custom path">Add</button>
  </div>

  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="list" class="muted">Loading…</div>

  <div class="row" style="margin-top:18px">
    <button class="btn btn-primary grow" onclick="runCleaner()"><span class="spinner"></span>HIDE</button>
    <button class="btn grow" onclick="unhide()">UNHIDE</button>
  </div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
