<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Integrity Box</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap"/>
  <link rel="stylesheet" href="common.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="wrap">
    <header class="title-bar">
      <div>
        <div id="module-name" class="title">Play Integrity Box</div>
        <div class="subtitle muted">Hated By Many, Defeated By None</div>
      </div>
      <select id="lang-dropdown" onchange="localStorage.setItem('ibLang',this.value);broadcastLangChange(this.value);location.reload()">
        <option value="en">English</option>
        <option value="zh_CN">简体中文</option>
        <option value="hi">Hinglish</option>
        <option value="ar">العربية</option>
        <option value="es">Spanish</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="ru">Русский</option>
        <option value="pl">Polski</option>
      </select>
    </header>

    <div class="dashboard">
      <div class="status-item">Integrity <span id="status-integrity" class="chip chip-muted">…</span></div>
      <div class="status-item">Profile <span id="status-profile" class="chip chip-muted">…</span></div>
      <div class="status-item">Props <span id="status-LineageProp" class="chip chip-muted">…</span></div>
      <div class="status-item">SELinux <span id="status-selinux" class="chip chip-muted">…</span></div>
      <div class="status-item">Config <span id="status-pixel" class="chip chip-muted">…</span></div>
      <div class="status-item">Expiry <span id="status-expiry" class="chip chip-muted">…</span></div>
      <div class="status-item">Patch <span id="status-patch" class="chip chip-muted">…</span></div>
      <div class="status-item">Target <span id="status-target" class="chip chip-muted">…</span></div>
    </div>

    <main>
      <div class="button-group">
        <h3 class="group-title">Integrity Hub</h3>
        <div class="button-grid">
          <button class="btn" data-type="user"><span class="icon material-symbols-outlined">android</span>Manage Targets<div class="spinner"></div></button>
          <button class="btn" data-type="repair"><span class="icon material-symbols-outlined">dynamic_form</span>Repair Mode<div class="spinner"></div></button>
          <button class="btn" data-type="flags"><span class="icon material-symbols-outlined">handyman</span>Module Settings<div class="spinner"></div></button>
          <button class="btn" data-type="profile"><span class="icon material-symbols-outlined">man</span>Set Profile<div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">Spoofing Hub</h3>
        <div class="button-grid">
          <button class="btn" data-type="pixel"><span class="icon material-symbols-outlined">engineering</span>Per App Spoofing<div class="spinner"></div></button>
          <button class="btn" data-type="piffork"><span class="icon material-symbols-outlined">shop</span>Play Integrity<div class="spinner"></div></button>
          <button class="btn" data-type="propspoofer"><span class="icon material-symbols-outlined">shield</span>Prop Spoofing<div class="spinner"></div></button>
          <button class="btn" data-type="spoofing"><span class="icon material-symbols-outlined">bolt</span>ROM Spoofing<div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">Meow Hub</h3>
        <div class="button-grid">
          <button class="btn" data-type="pilot"><span class="icon material-symbols-outlined">build</span>Auto Pilot<div class="spinner"></div></button>
          <button class="btn" data-type="ctrl"><span class="icon material-symbols-outlined">settings</span>Advanced Mode<div class="spinner"></div></button>
          <button class="btn" data-type="hash"><span class="icon material-symbols-outlined">threat_intelligence</span>Fix Boot Hash<div class="spinner"></div></button>
          <button class="btn" data-type="hide"><span class="icon material-symbols-outlined">visibility_off</span>Hide Sus Files<div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">Community & Support</h3>
        <div class="button-grid">
          <button class="btn" data-type="report"><span class="icon material-symbols-outlined">report</span>Report a Problem<div class="spinner"></div></button>
          <button class="btn" data-type="assistant"><span class="icon material-symbols-outlined">help</span>Ask Assistant<div class="spinner"></div></button>
          <button class="btn" data-type="support"><span class="icon material-symbols-outlined">volunteer_activism</span>Support the Developer<div class="spinner"></div></button>
          <button class="btn" data-type="downloader"><span class="icon material-symbols-outlined">download</span>Downloader<div class="spinner"></div></button>
        </div>
      </div>
    </main>
  </div>

<script src="script.js"></script>
<script src="TRANSLATIONS/meow.js"></script>
<script>(function(){try{var v=localStorage.getItem('ibLang')||'en';var s=document.getElementById('lang-dropdown');if(s)s.value=v;}catch(e){}})();</script>
<script>
function broadcastLangChange(lang) {
  var iframe = document.getElementById('active-iframe');
  if (iframe && iframe.contentWindow) {
    iframe.contentWindow.postMessage({ type: 'ibLangChange', lang: lang }, '*');
  }
}

(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = 'TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
