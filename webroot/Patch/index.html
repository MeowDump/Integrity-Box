<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Security Patch 2026</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.page{max-width:420px;margin:0 auto}
.header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:16px}
.preview-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:12px}
.preview-card.active{border-color:var(--accent)}
.preview-date{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.preview-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.section{margin-bottom:18px}
.section-header{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.month-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.month-scroll::-webkit-scrollbar{display:none}
.month-item{flex-shrink:0;padding:8px 14px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.month-item.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.date-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;color:var(--fg)}
.date-item.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.date-item.disabled{opacity:.25;cursor:not-allowed;background:transparent}
.date-item.empty{background:transparent;cursor:default;pointer-events:none}
.weekday-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.weekday{text-align:center;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.status{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:var(--muted)}
.status-dot{width:6px;height:6px;background:var(--ok);border-radius:50%;flex:none}
.status-dot.warning{background:var(--err)}
</style>
</head>
<body>
<div class="wrap wrap-narrow page">
  <div class="header"><h1 style="margin:0">Integrity Patch</h1></div>
  <div class="subtitle">Select security patch date for 2026</div>

  <div class="card">
    <div class="preview-card" id="previewCard">
      <div>
        <div class="preview-label">Selected Date</div>
        <div class="preview-date" id="previewDate">--/--</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">Month</div>
      <div class="month-scroll" id="monthScroll"></div>
    </div>

    <div class="section">
      <div class="section-header">Date</div>
      <div class="weekday-header">
        <div class="weekday">S</div>
        <div class="weekday">M</div>
        <div class="weekday">T</div>
        <div class="weekday">W</div>
        <div class="weekday">T</div>
        <div class="weekday">F</div>
        <div class="weekday">S</div>
      </div>
      <div class="date-grid" id="dateGrid"></div>
    </div>

    <button class="btn btn-primary btn-block" onclick="save()"><span class="spinner"></span>Apply Patch</button>

    <div class="status" id="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Initializing...</span>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
