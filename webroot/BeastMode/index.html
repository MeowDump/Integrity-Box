<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beast Mode</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.script-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.script-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);cursor:pointer;font-size:12px;font-weight:600;text-align:center}
.script-btn.on{border-color:var(--accent);color:var(--accent)}
.banking-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2)}
.banking-title{font-size:15px;font-weight:600;margin-bottom:2px}
.banking-sub{font-size:12px;color:var(--muted)}
.status-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;background:rgba(139,147,167,.12);color:var(--muted)}
.status-badge.on{background:rgba(63,185,111,.12);color:var(--ok)}
.status-badge.off{background:rgba(224,82,82,.12);color:var(--err)}
.log-entry{padding:2px 0;color:var(--muted)}
.log-entry.ok{color:var(--ok)}
.log-entry.err{color:var(--err)}
.log-entry.info{color:var(--accent)}

</style>
</head>
<body>

<div id="loader">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <div class="spinner-lg"></div>
    <div id="loaderText" class="muted" style="font-weight:600">Processing...</div>
  </div>
</div>

<div class="wrap wrap-narrow">
  <h1>Beast Mode</h1>
  <p class="muted small" style="text-align:center;margin-bottom:14px">Powered by IntegrityBox &nbsp;|&nbsp; &copy; 2026</p>

  <button id="execBtn" class="btn btn-primary btn-block" onclick="executeScripts()" style="margin-bottom:14px">
    <span class="spinner"></span>
    Let's Go!
  </button>

  <h2>Tools</h2>
  <div class="script-grid" id="scriptGrid" style="margin-bottom:16px"></div>

  <h2>Security</h2>
  <div class="banking-row" id="bankingRow" style="margin-bottom:16px">
    <div>
      <div class="banking-title">
        Banking Mode
        <span id="bankingBadge" class="status-badge off">OFF</span>
      </div>
      <div class="banking-sub">Enable me &amp; enjoy</div>
    </div>
    <label class="switch">
      <input id="bankingInput" type="checkbox" onchange="toggleBankingMode()">
      <span class="track"></span>
    </label>
  </div>

  <h2>Hide LSPosed</h2>
  <button class="btn btn-block" onclick="removeDex2oatFlags()" style="margin-bottom:14px">
    <span class="spinner"></span>
    Remove Dex2OAT Flags
  </button>

  <div id="logPanel" style="display:none">
    <h2>Operation Log</h2>
    <div class="log" id="logContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
