<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Keybox Selector</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.pkg-keybox2{color:var(--warn)}
.pkg-private{color:#d28bff}
.pkg-default{color:var(--fg)}
.app-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--panel-2);flex-wrap:wrap}
.app-row.selected-row{border-color:var(--accent)}
.app-row-name{font-weight:600;font-size:13px;cursor:pointer;word-break:break-all;width:100%;padding-left:50px}
.segment{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden}
.segment button{min-height:32px;padding:0 12px;background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.segment button.active{background:var(--accent);color:#fff}
.app-icon{width:38px;height:38px;border-radius:var(--radius-sm);object-fit:contain;background:var(--panel);flex-shrink:0}
.loadMore{display:block;margin:12px auto}
</style>
</head>
<body>

<div class="wrap">
  <h1>Key Simulator</h1>
  <p class="muted small" style="margin-bottom:14px">Powered by Integrity Box</p>

  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <button id="btnBackup" class="btn">Backup</button>
    <button id="btnRestore" class="btn btn-danger">Restore</button>
    <button id="btnSave" class="btn btn-primary">Save</button>
  </div>

  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <select id="bulkKeybox" style="width:auto;min-height:36px">
      <option value="default">Default</option>
      <option value="keybox2">Personal</option>
      <option value="private">Private</option>
    </select>
    <select id="bulkMode" style="width:auto;min-height:36px">
      <option value="auto">AUTO</option>
      <option value="generate">GENERATE</option>
      <option value="leaf">LEAF</option>
    </select>
  </div>

  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <button id="btnAddSelected" class="btn btn-primary" style="flex:1">Add</button>
    <button id="btnRemoveSelected" class="btn btn-danger" style="flex:1">Remove</button>
  </div>

  <input id="filter" type="search" placeholder="Filter package…" style="margin-bottom:14px"/>

  <div class="list-item" style="justify-content:space-between">
    <span id="selCount" class="muted small">0 selected</span>
    <button id="pkgHeader" class="btn" style="min-height:36px;padding:0 12px;font-size:13px">Select All</button>
  </div>

  <div id="appsBody" class="log" style="white-space:normal"><div class="muted">Loading…</div></div>

  <button id="btnLoadMore" class="btn loadMore" style="display:none">Load More</button>

  <div class="toast"></div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
