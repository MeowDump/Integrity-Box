<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Control Centre</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.row-toggle{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--panel-2);cursor:pointer}
.row-toggle.active{border-color:var(--accent)}
.row-toggle.spinning{pointer-events:none;opacity:.6}
.row-toggle .title{flex:1;font-size:14px;font-weight:600;min-width:0}
.row-toggle .title .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-toggle .badge{display:block;font-size:11px;font-weight:600;margin-top:2px;color:var(--muted)}
.row-toggle .badge.warn{color:var(--warn)}
.row-toggle .badge.danger{color:var(--err)}
.group-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.group-label:first-child{margin-top:0}

.modal-sheet{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px}
.info-item{padding:10px 0;border-bottom:1px solid var(--border)}
.info-item:last-child{border-bottom:none}
.info-item-title{font-size:14px;font-weight:600;margin-bottom:2px}
.info-item-desc{font-size:12px;color:var(--muted);line-height:1.5}
.info-item-flag{font-size:11px;color:var(--muted);margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.info-item-risk{font-size:11px;font-weight:600;margin-top:2px}
.info-section-title{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
.info-section-title:first-child{margin-top:0}
.reboot-hint{display:none;text-align:center;font-size:12px;color:var(--warn);font-weight:600;margin:12px 0}
.reboot-hint.show{display:block}
</style>
</head>
<body>

<div class="modal-overlay" id="infoModal" onclick="closeInfoModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">What do these do?</h2>
      <button class="btn" onclick="closeInfoModal()">Close</button>
    </div>
    <div id="infoContent"></div>
  </div>
</div>

<div class="wrap wrap-narrow">
  <h1>Control Centre</h1>

  <div class="card" style="padding:0">
    <div class="row-toggle" id="row-action_exec" onclick="toggleExec()" style="margin:12px 12px 0;border:none;background:transparent">
      <div class="title">
        <span class="name">Auto Run</span>
      </div>
      <label class="switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="cb-action_exec">
        <span class="track"></span>
      </label>
    </div>
    <div style="height:1px;background:var(--border);margin:0 12px"></div>
    <div class="group-label" style="padding:0 12px 4px;margin-top:14px">This will be done after reboot</div>
    <div id="flag-rows" style="padding:0 12px 12px"></div>

    <div class="group-label" style="padding:0 12px 4px">This will be done via action button</div>
    <div id="action-rows" style="padding:0 12px 12px"></div>

    <div class="group-label" style="padding:0 12px 4px">General</div>
    <div id="general-rows" style="padding:0 12px 12px"></div>

    <div class="group-label" style="padding:0 12px 4px">Kernel (Not recommended to enable)</div>
    <div id="kernel-rows" style="padding:0 12px 12px"></div>
    <div style="height:1px"></div>
  </div>

  <button class="btn btn-block" onclick="openInfoModal()" style="margin-top:8px">What do these do?</button>

  <div class="reboot-hint" id="rebootHint">Reboot required to apply changes</div>

  <button class="btn btn-block" onclick="refreshAll()" style="margin-top:8px">
    <span class="spinner"></span>
    Refresh States
  </button>

  <div class="muted small" style="text-align:center;margin-top:16px">IntegrityBox &bull; 2026</div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
