<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Keybox Loader</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.page{max-width:420px;margin:0 auto}
.hero{text-align:center;margin-bottom:20px}
.hero p{color:var(--muted);font-size:13px;margin-top:4px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.slot{aspect-ratio:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative}
.slot.active{border-color:var(--accent);background:rgba(79,140,255,.10)}
.slot-num{width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--muted)}
.slot.active .slot-num{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.slot-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slot.active .slot-label{color:var(--accent)}
.slot .check{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--ok);display:none}
.slot.active .check{display:block}
.files-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.files-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.file-item{cursor:pointer}
.file-name{font-size:14px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--muted)}
.file-load{flex:none;color:var(--accent);font-weight:600;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.scanning{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap page">

  <div class="hero">
    <h1 style="margin:0">Keybox Loader</h1>
    <p>Select a slot, then scan and choose a file</p>
  </div>

  <div class="slot-grid">
    <div class="slot active" data-slot="1">
      <div class="slot-num">1</div>
      <div class="slot-label">Slot</div>
      <div class="check"></div>
    </div>
    <div class="slot" data-slot="2">
      <div class="slot-num">2</div>
      <div class="slot-label">Slot</div>
      <div class="check"></div>
    </div>
    <div class="slot" data-slot="3">
      <div class="slot-num">3</div>
      <div class="slot-label">Slot</div>
      <div class="check"></div>
    </div>
  </div>

  <div class="files-container">
    <div class="files-header">
      <span class="files-title">Available Files</span>
      <button class="btn" id="refreshBtn" style="min-height:36px;padding:0 14px"><span class="spinner"></span>Scan</button>
    </div>
    <div id="fileList">
      <div class="empty">Tap scan to find keybox files</div>
    </div>
  </div>

</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
