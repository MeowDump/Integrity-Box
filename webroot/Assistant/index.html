<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IntegrityBox Assistant</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.page{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto;padding:14px 16px;overflow:hidden}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:var(--radius-sm);background:var(--panel-2);border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
#search{margin-bottom:10px}
.questions{overflow-y:auto;flex:0 1 auto;display:flex;flex-direction:column;gap:8px;max-height:220px;min-height:60px;padding-right:2px}
.q-btn{text-align:left;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--fg)}
.q-btn:active{background:var(--panel)}
.faq-panel{display:flex;flex-direction:column;gap:0;overflow:hidden;transition:max-height .25s ease,opacity .25s ease;max-height:320px;opacity:1}
.faq-panel.minimized{max-height:0;opacity:0}
#chat{flex:1;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;margin:12px 0}
.user-msg{align-self:flex-end;max-width:78%;padding:9px 12px;background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-sm);white-space:pre-wrap;overflow-wrap:break-word}
.bot-msg{align-self:flex-start;max-width:78%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);white-space:pre-wrap;overflow-wrap:break-word}
.user-msg p,.bot-msg p{margin:2px 0}
.typing{align-self:flex-start;padding:8px 12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.input-bar{display:flex;gap:8px}
.input-bar input{flex:1}
.contact-footer{text-align:center;margin-top:10px;font-size:13px;color:var(--muted)}
.contact-footer a{color:var(--accent);font-weight:700}
</style>
</head>
<body>

<div class="page">
  <div>
    <h1 style="font-size:18px;margin-bottom:2px">IntegrityBox Assistant</h1>
    <p class="muted small" style="margin-bottom:10px">Select a question or ask manually below</p>
  </div>

  <button id="toggleBtn" class="btn" style="align-self:flex-start;min-height:34px;padding:0 12px;font-size:13px;margin-bottom:10px">Minimize FAQ</button>

  <div class="faq-panel" id="faqPanel">
    <div class="tabs" id="tabs"></div>
    <input id="search" placeholder="Search questions..."/>
    <div class="questions" id="questions"></div>
  </div>

  <div id="chat"></div>

  <div class="input-bar">
    <input id="userInput" type="text" placeholder="Type your question..."/>
    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
  </div>

  <div class="contact-footer">
    Didn’t find what you need? <a href="#" onclick="openLink('https://t.me/TempMeow');return false">Contact Developer</a>
  </div>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
