<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --bg1: #0f172a;
  --bg2: #1e293b;
  --card: rgba(30, 41, 59, 0.8);
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --accent-glow: rgba(99, 102, 241, 0.15);
  --text: #e2e8f0;
  --sub: #94a3b8;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,0.12), transparent),
              linear-gradient(180deg, var(--bg1), var(--bg2));
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}

.header {
  position: relative;
  padding: 48px 20px 32px;
  text-align: center;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.2), transparent 70%);
  pointer-events: none;
}

.heart-pulse {
  font-size: 52px;
  display: inline-block;
  animation: pulse 2s ease-in-out infinite;
  margin-bottom: 12px;
  filter: drop-shadow(0 0 20px rgba(99,102,241,0.4));
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header p {
  margin: 8px 0 0;
  color: var(--sub);
  font-size: 14px;
}

.wrapper {
  max-width: 420px;
  margin: 0 auto;
  padding: 0 20px;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-left: 4px;
}

.section-label .line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(99,102,241,0.3), transparent);
}

.section-label span {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
}

.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
  z-index: 1000;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Contributors Grid */
.contributors-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.contributor-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 16px 8px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.5s ease-out backwards;
}

.contributor-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}

.contributor-card:hover {
  transform: translateY(-2px);
  border-color: rgba(99, 102, 241, 0.25);
  box-shadow: 0 8px 32px rgba(99, 102, 241, 0.12), 0 0 0 1px rgba(99, 102, 241, 0.08);
}

.contributor-card:active {
  transform: translateY(0) scale(0.98);
}

.contributor-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(99, 102, 241, 0.3);
  margin-bottom: 10px;
}

.contributor-avatar-placeholder {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}

.contributor-avatar-placeholder .material-icons {
  font-size: 28px;
  color: white;
}

.contributor-name {
  font-size: 13px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.2px;
  line-height: 1.2;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.contributor-role {
  font-size: 10px;
  color: var(--sub);
  margin-top: 3px;
  line-height: 1.2;
}

.contributor-langs {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
  justify-content: center;
}

.lang-tag {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  border: 1px solid rgba(99, 102, 241, 0.2);
}

.platform-icon {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.contributor-card:hover .platform-icon {
  opacity: 1;
}

.empty-contributor {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 16px 8px;
  background: rgba(30, 41, 59, 0.4);
  border-radius: 16px;
  border: 1px dashed rgba(255,255,255,0.08);
  opacity: 0.5;
  animation: fadeUp 0.5s ease-out backwards;
}

.empty-contributor .contributor-name {
  color: var(--sub);
  font-weight: 500;
  font-size: 12px;
}

.empty-contributor .contributor-role {
  color: var(--sub);
  opacity: 0.7;
  font-size: 10px;
}

/* Payment Methods */
.payment-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.payment-grid .card {
  background: var(--card);
  border-radius: 20px;
  padding: 0;
  margin-bottom: 0;
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  overflow: hidden;
  position: relative;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeUp 0.5s ease-out backwards;
}

.payment-grid .card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}

.payment-grid .card:hover {
  transform: translateY(-2px);
  border-color: rgba(99, 102, 241, 0.25);
  box-shadow: 0 8px 32px rgba(99, 102, 241, 0.12), 0 0 0 1px rgba(99, 102, 241, 0.08);
}

.payment-grid .card:active {
  transform: translateY(0) scale(0.98);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 16px 12px;
}

.icon-ring {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.icon-ring::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  opacity: 0.3;
  z-index: -1;
}

.icon-ring .material-icons {
  font-size: 22px;
  color: white;
}

.card-info {
  flex: 1;
  min-width: 0;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.2px;
}

.card-sub {
  font-size: 12px;
  color: var(--sub);
  margin-top: 2px;
}

.qr-wrap {
  padding: 0 16px 12px;
}

.qr {
  width: 100%;
  max-width: 200px;
  margin: 0 auto;
  display: block;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
}

.addr-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 16px 16px;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 14px;
  padding: 4px 4px 4px 14px;
  border: 1px solid rgba(255,255,255,0.05);
}

.addr-text {
  flex: 1;
  font-size: 12px;
  font-family: 'SF Mono', 'Courier New', monospace;
  color: var(--sub);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.3px;
}

.copy-btn {
  border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
  flex-shrink: 0;
}

.copy-btn:hover {
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
  transform: translateY(-1px);
}

.copy-btn:active {
  transform: scale(0.95);
}

.copy-btn .material-icons {
  font-size: 16px;
}

/* Compact payment cards (2-column grid items) */
.payment-grid.compact {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.payment-grid.compact .card {
  border-radius: 16px;
}

.payment-grid.compact .card-top {
  padding: 12px 12px 8px;
  gap: 10px;
}

.payment-grid.compact .icon-ring {
  width: 36px;
  height: 36px;
  border-radius: 12px;
}

.payment-grid.compact .icon-ring::after {
  border-radius: 14px;
}

.payment-grid.compact .icon-ring .material-icons {
  font-size: 18px;
}

.payment-grid.compact .card-title {
  font-size: 13px;
}

.payment-grid.compact .card-sub {
  font-size: 10px;
}

.payment-grid.compact .addr-bar {
  margin: 0 12px 12px;
  padding: 3px 3px 3px 10px;
  border-radius: 10px;
}

.payment-grid.compact .addr-text {
  font-size: 10px;
}

.payment-grid.compact .copy-btn {
  padding: 7px 10px;
  font-size: 10px;
  border-radius: 8px;
}

.payment-grid.compact .copy-btn .material-icons {
  font-size: 14px;
}

.footer-note {
  text-align: center;
  padding: 24px 20px;
  color: var(--sub);
  font-size: 12px;
}

.footer-note .material-icons {
  font-size: 14px;
  vertical-align: middle;
  margin-right: 4px;
  color: var(--accent);
}

@media (max-width: 360px) {
  .contributors-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .payment-grid.compact {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="heart-pulse">🫂</div>
  <p>Special thanks to these people</p>
</div>

<div class="wrapper">
  <div class="section-label">
    <span>Contributors</span>
    <div class="line"></div>
  </div>
  <div id="contributorsList" class="contributors-grid"></div>

  <div class="header">
    <div class="heart-pulse">🪙</div>
    <h1>Donate</h1>
    <p>If you want to support my work</p>
  </div>

  <div class="section-label">
    <span>Payment Methods</span>
    <div class="line"></div>
  </div>
  <div id="paymentFeatured"></div>
  <div id="paymentGrid" class="payment-grid compact"></div>
</div>

<div class="footer-note">
  <span class="material-icons">security</span>
  All transactions are secure and anonymous
</div>

<div id="toast" class="toast">Copied to clipboard</div>

<script>
const toast = document.getElementById("toast");

function popup(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => popup("Copied to clipboard"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    popup("Copied to clipboard");
  }
}

function openExternal(url) {
  if (typeof ksu !== "undefined" && ksu.exec) {
    ksu.exec(`nohup am start -a android.intent.action.VIEW -d "${url}" > /dev/null 2>&1 &`);
    popup("Opening link...");
  } else if (typeof sh !== "undefined") {
    sh(`nohup am start -a android.intent.action.VIEW -d "${url}" > /dev/null 2>&1 &`);
    popup("Opening link...");
  } else {
    window.open(url, "_blank");
    popup("Opening link...");
  }
}

const featuredData = [
  {
    label: "Binance Pay",
    sub: "Fast & Easy",
    address: "69695263",
    qr: "https://raw.githubusercontent.com/MeowDump/Integrity-Box/old/DUMP/binance.png",
    icon: "payments"
  }
];

const gridData = [
  {
    label: "TRC20 USDT",
    sub: "Tron Network",
    address: "TCfhyVTfJDw8gHQT8Ph7DknNgie6ZAH5Bt",
    icon: "currency_bitcoin"
  },
  {
    label: "BEP20 USDT",
    sub: "BNB Chain",
    address: "0x6b3f76339f2953db765dd2fb305784643e7d49df",
    icon: "token"
  },
  {
    label: "BNB Smart Chain",
    sub: "Native BNB",
    address: "0x33a6b33b40d54e83d88ca6f2f1ae8532248316eb",
    icon: "link"
  },
  {
    label: "Bitcoin",
    sub: "BTC Network",
    address: "bc1pt4hc00jkgf75f7hhwkume4utwux2jqwc0343zsnxafvqp6zfmtqqu4htfu",
    icon: "currency_bitcoin"
  },
  {
    label: "Ethereum",
    sub: "ERC20 / ETH",
    address: "0x33a6b33b40d54e83d88ca6f2f1ae8532248316eb",
    icon: "currency_exchange"
  },
  {
    label: "Solana",
    sub: "SOL Network",
    address: "CJhhei8bAWt4HinNofqxydVCXcGX1afDNKN9hwi1LoGR",
    icon: "bolt"
  },
  {
    label: "TON",
    sub: "The Open Network",
    address: "UQD1ppd0dcSK73HPd9uPYAXLxmtRuNY9tzzUt8t4_Z9K0kKb",
    icon: "send"
  },
  {
    label: "LiteCoin",
    sub: "LTC Network",
    address: "ltc1q4nywcj2l06rkat0nzccr9xj8hq9zsvhlwau80h",
    icon: "flash_on"
  }
];

function renderFeatured() {
  const container = document.getElementById("paymentFeatured");
  container.innerHTML = "";

  featuredData.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.style.animationDelay = (i * 0.06) + "s";

    el.innerHTML = `
      <div class="card-top">
        <div class="icon-ring" style="background: linear-gradient(135deg, var(--accent), var(--accent2));">
          <span class="material-icons">${d.icon}</span>
        </div>
        <div class="card-info">
          <div class="card-title">${d.label}</div>
          <div class="card-sub">${d.sub}</div>
        </div>
      </div>
      <div class="qr-wrap"><img src="${d.qr}" class="qr" alt="${d.label} QR"></div>
      <div class="addr-bar">
        <span class="addr-text">${d.address}</span>
        <button class="copy-btn" data="${d.address}">
          <span class="material-icons">content_copy</span>
          Copy
        </button>
      </div>
    `;

    container.appendChild(el);
  });
}

function renderGrid() {
  const container = document.getElementById("paymentGrid");
  container.innerHTML = "";

  gridData.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.style.animationDelay = ((i + 1) * 0.06) + "s";

    el.innerHTML = `
      <div class="card-top">
        <div class="icon-ring" style="background: linear-gradient(135deg, var(--accent), var(--accent2));">
          <span class="material-icons">${d.icon}</span>
        </div>
        <div class="card-info">
          <div class="card-title">${d.label}</div>
          <div class="card-sub">${d.sub}</div>
        </div>
      </div>
      <div class="addr-bar">
        <span class="addr-text">${d.address}</span>
        <button class="copy-btn" data="${d.address}">
          <span class="material-icons">content_copy</span>
          Copy
        </button>
      </div>
    `;

    container.appendChild(el);
  });
}

renderFeatured();
renderGrid();

document.addEventListener("click", e => {
  const btn = e.target.closest(".copy-btn");
  if (!btn) return;

  const text = btn.getAttribute("data");
  copyText(text);

  const original = btn.innerHTML;
  btn.innerHTML = `<span class="material-icons">check</span>Done`;
  btn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";

  setTimeout(() => {
    btn.innerHTML = original;
    btn.style.background = "";
  }, 1500);
});

function getPlatformIcon(link) {
  if (!link) return "";
  if (link.includes("github.com")) {
    return `<svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>`;
  }
  if (link.includes("t.me") || link.includes("telegram")) {
    return `<svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`;
  }
  return "";
}

function renderContributors(contributors) {
  const container = document.getElementById("contributorsList");
  container.innerHTML = "";

  contributors.forEach((c, i) => {
    const hasData = c.name && c.name.trim().length > 0;
    const el = document.createElement("div");
    el.className = hasData ? "contributor-card" : "empty-contributor";
    el.style.animationDelay = (i * 0.06) + "s";

    if (hasData && c.link) {
      el.addEventListener("click", () => openExternal(c.link));
    }

    const platformIcon = hasData ? getPlatformIcon(c.link) : "";

    const avatarHtml = hasData && c.avatar
      ? `<img src="${c.avatar}" class="contributor-avatar" alt="${c.name}" onerror="this.style.display='none';this.parentElement.querySelector('.contributor-avatar-placeholder').style.display='flex'">`
      : "";

    const placeholderHtml = (!hasData || !c.avatar)
      ? `<div class="contributor-avatar-placeholder" style="${hasData && c.avatar ? 'display:none;' : ''}"><span class="material-icons">person</span></div>`
      : "";

    const langsHtml = hasData && c.languages && c.languages.length > 0
      ? `<div class="contributor-langs">${c.languages.map(l => `<span class="lang-tag">${l}</span>`).join("")}</div>`
      : "";

    const nameText = hasData ? c.name : "Available";
    const roleText = hasData ? c.role : "Slot";

    el.innerHTML = `
      ${platformIcon}
      ${avatarHtml}
      ${placeholderHtml}
      <div class="contributor-name">${nameText}</div>
      <div class="contributor-role">${roleText}</div>
      ${langsHtml}
    `;

    container.appendChild(el);
  });
}

fetch("../TRANSLATIONS/contributors.json")
  .then(r => r.json())
  .then(data => renderContributors(data))
  .catch(err => {
    console.error("Failed to load contributors:", err);
    document.getElementById("contributorsList").innerHTML = `
      <div class="empty-contributor" style="grid-column:1/-1; justify-content:center; flex-direction:row; gap:8px;">
        <span class="material-icons" style="color:var(--sub);">error_outline</span>
        <span style="color:var(--sub); font-size:13px;">Unable to load contributors</span>
      </div>
    `;
  });
</script>
