<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Support</title>
<link rel="stylesheet" href="../common.css"/>
<style>
.contributors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.contributor-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;position:relative;color:inherit}
.contributor-card.empty{border-style:dashed;opacity:.55;cursor:default}
.contributor-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.avatar-placeholder{width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-bottom:8px}
.contributor-name{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contributor-role{font-size:11px;color:var(--muted);margin-top:2px}
.contributor-langs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.lang-tag{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:4px;background:rgba(79,140,255,.12);color:var(--accent);border:1px solid rgba(79,140,255,.25)}
.platform-icon{position:absolute;top:6px;right:6px;width:16px;height:16px;color:var(--muted)}
.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:8px}
.pay-card.featured{grid-column:1/-1}
.pay-title{font-size:14px;font-weight:600}
.pay-sub{font-size:12px;color:var(--muted)}
.qr{width:100%;max-width:200px;margin:0 auto;display:block;border-radius:var(--radius-sm);border:1px solid var(--border)}
.addr-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 4px 4px 10px}
.addr-text{flex:1;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0}
.copy-btn.done{border-color:var(--ok);color:var(--ok)}
@media(max-width:360px){
  .contributors-grid{grid-template-columns:repeat(2,1fr)}
  .payment-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap wrap-narrow">
  <h1>Support</h1>
  <p class="muted small" style="text-align:center;margin:-6px 0 18px">Special thanks to these people</p>

  <h2>Contributors</h2>
  <div id="contributorsList" class="contributors-grid"></div>

  <h2>Donate</h2>
  <p class="muted small">If you want to support my work</p>
  <div id="paymentFeatured" class="payment-grid" style="margin-top:10px"></div>
  <div id="paymentGrid" class="payment-grid" style="margin-top:10px"></div>

  <p class="muted small" style="text-align:center;margin-top:24px">All transactions are secure and anonymous</p>
</div>

<script src="script.js"></script>
<script src="../TRANSLATIONS/meow.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ibLang') || 'en';
  if (lang !== 'en') {
    var s = document.createElement('script');
    s.src = '../TRANSLATIONS/' + lang + '.js';
    s.onload = function(){ if(window.i18nBoot) window.i18nBoot(); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
